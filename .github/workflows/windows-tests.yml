# Windows の自動テスト（Windows PowerShell 5.1）
#
# 過去の重大事故（文字化け・BOM 欠落・PowerShell 5.1 だけの挙動・アクセス権の締め出し）は
# ほぼ Windows 固有で、mac の pwsh では見つけられなかった。ここでは GitHub の windows-latest に
# 標準で入っている Windows PowerShell 5.1 で、Windows 用の見張りとテストを毎回動かす。
#
# ジョブ:
#   ps51             : scripts\windows\test の必須テスト（落ちたら赤）
#   ps51-machine     : Windows 実機向けのテスト（auto-mode）
#   install-doctor   : 日本語名の作業フォルダへ導入 → 診断（出荷条件 C の足がかり）
#   playwright       : Playwright MCP を事前に入れ、ネットワーク無しで起動できること
#                      （教室一斉起動の時間切れ対策・2026-10。npm.cmd / 空白入りのホームも通す）
#   ai-tools         : 「AIツールをまとめて入れる」が、入っていない Codex CLI / Claude Code /
#                      OpenCode / agy を本当に新しく入れること（v1.19.5。本物の npm と公式インストーラー）
#
# 5 本とも必須（落ちたら赤になる）。最初の 3 本は v1.19.1 で様子見を外し、playwright と ai-tools は 2026-10 に追加した。
#
# 改行: Windows の git は既定で LF を CRLF に変換して取り出すため、導入時のハッシュ照合が
# 配布 ZIP（git archive = コミットしたバイト列そのまま）と食い違う。checkout 前に変換を止める。
name: windows-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ps51:
    name: PowerShell 5.1 tests (required)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: Keep committed line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Versions
        run: |
          $PSVersionTable.PSVersion
          node --version
      - name: Run Windows tests on PowerShell 5.1
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\test\run-all.ps1 -Exclude auto-mode.test.ps1
          exit $LASTEXITCODE

  ps51-machine:
    name: Windows machine tests
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: Keep committed line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run auto-mode tests on PowerShell 5.1
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\test\run-all.ps1 -Only auto-mode.test.ps1
          exit $LASTEXITCODE

  install-doctor:
    name: Install into a Japanese-named folder, then doctor
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - name: Keep committed line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Codex CLI (doctor checks that it is installed)
        run: npm install -g @openai/codex
      - name: Install and doctor on PowerShell 5.1
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\test\ci-install-doctor.ps1
          exit $LASTEXITCODE

  playwright:
    name: Playwright MCP prefetch, then start offline
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: Keep committed line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # GitHub は run: の中身を BOM なしの .ps1 にして PowerShell 5.1 に渡すため、日本語を直接書くと
      # 読み違えて構文エラーになる（2026-10 実測）。run: の中は ASCII だけにし、日本語のフォルダ名
      # （テスト）は文字コードで組み立てる。
      - name: Prefetch and start Playwright MCP from a clean home with a space and Japanese in its path
        run: |
          $jp = -join ([char]0x30C6, [char]0x30B9, [char]0x30C8)
          $home2 = Join-Path $env:RUNNER_TEMP ('pw home ' + $jp)
          New-Item -ItemType Directory -Force -Path $home2 | Out-Null
          $env:USERPROFILE = $home2
          $env:HOME = $home2
          node scripts\common\test\ci-playwright-startup.js
          exit $LASTEXITCODE

  ai-tools:
    name: AI tools button installs missing tools (real install)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    steps:
      - name: Keep committed line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # run: の中は ASCII だけにする（BOM なしの .ps1 として PowerShell 5.1 に渡されるため）。
      - name: Run update-ai-tools.ps1 and check that all four tools are installed
        env:
          AI_SAFE_NO_PROMPT: '1'
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\update-ai-tools.ps1 -Workspace $env:GITHUB_WORKSPACE
          $missing = @()
          foreach ($c in @('codex', 'claude', 'opencode')) {
            if (-not (Get-Command $c -ErrorAction SilentlyContinue)) { $missing += $c }
          }
          $agyFiles = @((Join-Path $env:LOCALAPPDATA 'Antigravity\agy.exe'), (Join-Path $env:USERPROFILE '.local\bin\agy.exe')) | Where-Object { Test-Path -LiteralPath $_ }
          if (-not (Get-Command agy -ErrorAction SilentlyContinue) -and -not $agyFiles) { $missing += 'agy' }
          if ($missing.Count -gt 0) { Write-Host ('missing after install: ' + ($missing -join ', ')); exit 1 }
          Write-Host 'codex, claude, opencode and agy are installed'
