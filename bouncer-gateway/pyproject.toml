[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-bouncer"
version = "0.1.0"
description = "Local-first LLM gateway guard powered by deterministic rules and Gemma 4"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bouncer = "bouncer.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
