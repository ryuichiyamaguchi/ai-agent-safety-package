sandbox_mode = "workspace-write"
approval_policy = "untrusted"
model_reasoning_effort = "medium"

# [features] は Codex CLI の旧フラグ機構。本パッケージは hooks 配線を
# configs/codex/hooks.<platform>.json 経由で行うため、ここでは hooks = false を
# 明示して旧 features 経路を完全に無効化している。Hook を有効化するには
# hooks.mac.json / hooks.windows.json を編集する。
[features]
hooks = false

[sandbox_workspace_write]
network_access = false
exclude_tmpdir_env_var = true
exclude_slash_tmp = true

[windows]
sandbox = "unelevated"

[shell_environment_policy]
inherit = "all"
exclude = [
  "OPENAI_API_KEY",
  "ANTHROPIC_API_KEY",
  "GEMINI_API_KEY",
  "GOOGLE_API_KEY",
  "AWS_ACCESS_KEY_ID",
  "AWS_SECRET_ACCESS_KEY",
  "GITHUB_TOKEN",
  "NPM_TOKEN",
  "SLACK_BOT_TOKEN"
]

[profiles.safe]
sandbox_mode = "workspace-write"
approval_policy = "untrusted"
model_reasoning_effort = "medium"

[profiles.safe.sandbox_workspace_write]
network_access = false
exclude_tmpdir_env_var = true
exclude_slash_tmp = true
