sandbox_mode = "workspace-write"
approval_policy = "untrusted"
model_reasoning_effort = "medium"

# A-2: hooks = true に変更。guard 系 hook が確実に発火するよう有効化する。
# launcher (launch-codex-safe.sh) 側でも -c features.hooks=true を渡して二重保証。
[features]
hooks = true

[sandbox_workspace_write]
network_access = false
exclude_tmpdir_env_var = true
exclude_slash_tmp = true

[shell_environment_policy]
inherit = "all"
exclude = [
  "OPENAI_API_KEY",
  "ANTHROPIC_API_KEY",
  "GEMINI_API_KEY",
  "GOOGLE_API_KEY",
  "AWS_ACCESS_KEY_ID",
  "AWS_SECRET_ACCESS_KEY",
  "GITHUB_TOKEN",
  "NPM_TOKEN",
  "SLACK_BOT_TOKEN"
]

# codex 0.135: `--profile safe` と同一 config.toml 内の `[profiles.safe]` は同時に使えず
# 起動が fatal error になる。プロファイル設定は configs/codex/safe.config.toml に分離し、
# launcher 側で $CODEX_HOME/safe.config.toml として配置する(--profile safe で層を重ねる)。

# Safe Auto Mode: doctor の隔離ドリルが参照する permissions プロファイル。
# `codex sandbox --permissions-profile safeprobe` で workspace 書込可・ネット遮断を実証する。
# (実際のドリルはユーザー config に依存しない一時 CODEX_HOME を使うが、launcher 実行と
#  doctor 検証が同じ隔離意図を共有できるようここにも定義しておく。)
[permissions.safeprobe]
description = "Safe Auto Mode isolation drill: workspace write, network blocked"
extends = ":workspace"

[permissions.safeprobe.network]
enabled = false
